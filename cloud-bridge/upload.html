<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>上传音频</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
         margin: 0; padding: 24px; background: #f7f5f0; color: #1f1d1a;
         display: flex; flex-direction: column; align-items: center; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 4px; letter-spacing: .5px; }
  .sub { color: #6f6a62; font-size: 13px; margin-bottom: 20px; }
  .drop { width: min(560px, 90vw); min-height: 220px; border: 2px dashed #b9b1a3;
          border-radius: 12px; background: #fffaf2; display: flex;
          flex-direction: column; align-items: center; justify-content: center;
          transition: background .15s ease, border-color .15s ease;
          padding: 24px; cursor: pointer; }
  .drop.hover { background: #ffeed1; border-color: #d97706; }
  .drop.busy  { background: #eef4ff; border-color: #1f6feb; cursor: wait; }
  .drop.done  { background: #eef9f1; border-color: #2e7d4f; cursor: default; }
  .drop.fail  { background: #fdecec; border-color: #c0392b; }
  .icon { font-size: 32px; line-height: 1; }
  .label { margin-top: 12px; font-size: 14px; font-weight: 500; }
  .meta  { margin-top: 6px; font-size: 12px; color: #6f6a62; font-family: "SF Mono", ui-monospace, Menlo, monospace; }
  input[type=file] { display: none; }
  .bar { width: 100%; height: 6px; background: rgba(0,0,0,.08); border-radius: 999px;
         margin-top: 14px; overflow: hidden; display: none; }
  .bar .fill { height: 100%; background: #1f6feb; width: 0; transition: width .1s linear; }
  .drop.busy .bar { display: block; }
  .status { margin-top: 10px; font-size: 12px; color: #6f6a62;
            font-family: "SF Mono", ui-monospace, Menlo, monospace; min-height: 14px; }
  @media (prefers-color-scheme: dark) {
    body { background: #1d1c1a; color: #ece6d8; }
    .drop { background: #2a2724; border-color: #5b5447; }
    .drop.done { background: #1f3a2a; border-color: #4f9a6f; }
    .drop.busy { background: #1f2a3a; border-color: #4f86d9; }
    .drop.fail { background: #3a2424; border-color: #d96f5f; }
    .sub, .meta, .status { color: #aea69a; }
  }
</style>
</head>
<body>
  <h1>上传音频</h1>
  <div class="sub">把音频文件拖到下面，或点一下选文件。上传完页面会自动告诉 agent。</div>
  <label class="drop" id="drop" tabindex="0">
    <div class="icon" id="icon">⬆️</div>
    <div class="label" id="label">拖文件到这里 / 点击选择</div>
    <div class="meta" id="meta"></div>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="status" id="status"></div>
    <input type="file" id="file" accept="audio/*">
  </label>

<script>
(function(){
  const cfg = window.__UPLOAD__ || {};
  const SESSION = cfg.session;
  const CAP = cfg.max_bytes || (2 * 1024 * 1024 * 1024);

  const drop = document.getElementById('drop');
  const fileInput = document.getElementById('file');
  const icon = document.getElementById('icon');
  const label = document.getElementById('label');
  const meta = document.getElementById('meta');
  const fill = document.getElementById('fill');
  const status = document.getElementById('status');

  function fmtBytes(n) {
    if (n < 1024) return n + ' B';
    if (n < 1024*1024) return (n/1024).toFixed(1) + ' KB';
    if (n < 1024*1024*1024) return (n/1024/1024).toFixed(1) + ' MB';
    return (n/1024/1024/1024).toFixed(2) + ' GB';
  }

  function setState(name, opts = {}) {
    drop.classList.remove('hover', 'busy', 'done', 'fail');
    if (name) drop.classList.add(name);
    if (opts.icon) icon.textContent = opts.icon;
    if (opts.label) label.textContent = opts.label;
    if (opts.meta != null) meta.textContent = opts.meta;
    if (opts.status != null) status.textContent = opts.status;
    if (opts.fill != null) fill.style.width = opts.fill + '%';
  }

  // Chunked upload — slice the file into ~5MB parts, POST each one
  // sequentially with per-chunk retry. Why this replaces the single POST:
  //   - Cloudflare quick tunnel cancels long-lived requests mid-transfer.
  //     A 330MB single POST died at 72% with no recovery option for the
  //     surviving 72% on either side. Chunked retries just the failed part.
  //   - "100% progress bar" was browser→OS-socket bytes, not server-received
  //     bytes. Users (Ivy 2026-06-11) closed the tab on visual 100% before
  //     the server response arrived → silent data loss. Now progress is
  //     server-ACK'd bytes only.
  //
  // CHUNK_SIZE chosen for the CF cancellation envelope: empirically tunnels
  // hold up to ~200-300 MB in a single request before cutoff risk grows
  // sharply. 5MB chunks keep any single failure cheap to retry without
  // explosion in HTTP round-trips for 1GB files (~200 chunks).
  const CHUNK_SIZE = 5 * 1024 * 1024;
  const MAX_RETRIES = 3;
  const RETRY_BASE_MS = 800;

  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

  async function sendChunk(file, part, totalParts, attempt = 1) {
    const start = part * CHUNK_SIZE;
    const end = Math.min(start + CHUNK_SIZE, file.size);
    const blob = file.slice(start, end);

    try {
      const res = await fetch('/api/' + SESSION + '/upload-chunk', {
        method: 'POST',
        headers: {
          // file.type may be empty when the OS doesn't recognize the
          // extension; octet-stream is fine and the agent sniffs anyway.
          'content-type': file.type || 'application/octet-stream',
          'x-upload-part': String(part),
          'x-upload-total-parts': String(totalParts),
          'x-upload-total-bytes': String(file.size),
        },
        body: blob,
      });
      if (!res.ok) {
        // Server tells us via x-next-part what it actually expects, in case
        // we got out of sync.
        const nextPart = res.headers.get('x-next-part');
        let msg = 'HTTP ' + res.status;
        try { const j = await res.json(); if (j.error) msg += ' — ' + j.error; } catch {}
        if (nextPart != null && +nextPart !== part) {
          // Re-align: the server already has this chunk or expects an
          // earlier one. Re-call ourselves at the expected part.
          return { resync: +nextPart };
        }
        throw new Error(msg);
      }
      return await res.json();
    } catch (e) {
      if (attempt >= MAX_RETRIES) throw e;
      // Exponential backoff with jitter so retries from multiple browsers
      // don't synchronize. Jitter range ±25% of the base wait.
      const wait = RETRY_BASE_MS * Math.pow(2, attempt - 1) * (0.75 + Math.random() * 0.5);
      await sleep(wait);
      return sendChunk(file, part, totalParts, attempt + 1);
    }
  }

  async function pickAndUpload(file) {
    if (!file) return;
    if (file.size > CAP) {
      setState('fail', { icon: '⚠️', label: '文件太大', meta: fmtBytes(file.size) + ' > 上限 ' + fmtBytes(CAP), status: '换个小一点的，或者跟 agent 说调上限' });
      return;
    }
    setState('busy', { icon: '⏳', label: '上传中…', meta: file.name + ' · ' + fmtBytes(file.size), status: '准备分块…', fill: 0 });

    const totalParts = Math.ceil(file.size / CHUNK_SIZE);
    let bytesReceived = 0;
    let part = 0;

    try {
      while (part < totalParts) {
        const result = await sendChunk(file, part, totalParts);
        if (result.resync != null) {
          // Server told us a different part is expected (chunk already
          // landed, or our state got desynced). Jump there.
          part = result.resync;
          if (result.bytes_received != null) bytesReceived = result.bytes_received;
          setState('busy', {
            fill: (bytesReceived / file.size) * 100,
            status: '重对齐到块 ' + (part + 1) + ' / ' + totalParts + ' …'
          });
          continue;
        }
        if (result.bytes_received != null) bytesReceived = result.bytes_received;
        if (result.done) bytesReceived = file.size;
        const pct = (bytesReceived / file.size) * 100;
        const partLabel = '块 ' + (part + 1) + ' / ' + totalParts;
        const byteLabel = fmtBytes(bytesReceived) + ' / ' + fmtBytes(file.size);
        setState('busy', { fill: pct, status: partLabel + ' · ' + byteLabel + ' (' + pct.toFixed(1) + '%)' });

        if (result.done) {
          // The final chunk's 200 response IS the server-side rename
          // confirmation. Anything before this is just bytes in transit.
          setState('done', {
            icon: '✅', label: '上传完成',
            meta: file.name + ' · ' + fmtBytes(file.size),
            status: 'agent 已收到，可以关掉这页',
            fill: 100,
          });
          return;
        }
        part++;
      }
      // Loop exited without seeing done: true — shouldn't happen given the
      // server contract, but treat as failure for safety.
      throw new Error('uploaded all parts but server did not confirm done');
    } catch (e) {
      setState('fail', {
        icon: '⚠️', label: '上传失败', meta: file.name,
        status: '块 ' + (part + 1) + ' 失败：' + e.message + ' · 试着关页面重传',
      });
    }
  }

  drop.addEventListener('click', () => { if (!drop.classList.contains('busy') && !drop.classList.contains('done')) fileInput.click(); });
  drop.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') fileInput.click(); });
  fileInput.addEventListener('change', () => pickAndUpload(fileInput.files[0]));

  ['dragenter','dragover'].forEach(ev =>
    drop.addEventListener(ev, e => { e.preventDefault(); if (!drop.classList.contains('busy') && !drop.classList.contains('done')) drop.classList.add('hover'); }));
  ['dragleave','drop'].forEach(ev =>
    drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('hover'); }));
  drop.addEventListener('drop', e => {
    if (drop.classList.contains('busy') || drop.classList.contains('done')) return;
    const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    pickAndUpload(file);
  });
})();
</script>
</body>
</html>
